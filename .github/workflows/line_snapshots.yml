# Phase 10: automated line snapshots between the owner's Wednesday prediction
# run and kickoff, so games get a later pre-kickoff snapshot for CLV
# (docs/PHASE10_PREREG.md Section 3; Amendment 3 needs >= 6 h after the
# prediction snapshot).
#
# Kickoff-aware (2026-11-12). The cron fires every hour; each run asks
# scripts/live/snapshot_gate.py whether to snapshot. It refreshes ONLY if
#   (a) an unplayed REG game kicks off within the next 4 h, AND
#   (b) no snapshot in data/raw/snapshots/ is < 90 min old.
# Otherwise the run ends with no refresh and no commit. Kickoffs are UTC from
# the latest committed snapshot's schedule, so DST, Saturday, holiday and
# international games need no hand-maintained slots.
#
# Why not fixed slots: GitHub created the old fixed-slot runs 2.4-6 h late
# (e.g. Thu 22:07 UTC slot -> run at Fri 02:08 UTC, after the 01:15 UTC TNF).
# The gate decides on the run's ACTUAL time, so lateness cannot produce a
# post-kickoff snapshot it thinks is pre-kickoff; it only needs some hourly
# run to land inside each game's 4 h window.
#
# When the gate fires it runs `python -m src.data_ingest --refresh-season 2026`,
# which writes only under data/raw/ (snapshots + pull_metadata.json committed;
# the raw pbp/schedule parquet files are gitignored and discarded with the
# runner). It never touches data/live/, docs/live/ or predictions; the commit
# step below refuses if anything else changed.
#
# "Run workflow" (manual) with force=true snapshots regardless of the gate.

name: line snapshots

on:
  schedule:
    - cron: "17 * * * *"    # hourly at :17 (off the congested top of the hour); snapshot_gate.py decides
  workflow_dispatch:
    inputs:
      force:
        description: "Snapshot now, ignoring the kickoff gate"
        type: boolean
        default: false

permissions:
  contents: write

# Never two runs at once (late hourly runs can bunch up). A newer queued run
# replaces an older queued one, which is harmless: the gate re-decides at run time.
concurrency:
  group: line-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history, so the pre-push rebase works

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"    # matches venv (see requirements.txt)
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Gate, and refresh 2026 if it fires (pbp + schedule + snapshot)
        id: gate
        run: python -m scripts.live.snapshot_gate --season 2026 ${{ inputs.force && '--force' || '' }}

      - name: Commit and push snapshot only
        if: steps.gate.outputs.fire == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/snapshots data/raw/pull_metadata.json
          # Refuse if the refresh changed anything else that git tracks.
          if [ -n "$(git status --porcelain --untracked-files=all | grep -v '^A  data/raw/snapshots/' | grep -v '^M  data/raw/pull_metadata.json$' || true)" ]; then
            echo "REFUSING: unexpected changes outside data/raw/snapshots and data/raw/pull_metadata.json:"
            git status --porcelain --untracked-files=all
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Nothing changed; no commit."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Phase 10: automated line snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The owner may have pushed since checkout; replay on top of it.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # If the push fails (e.g. a rebase conflict in pull_metadata.json), the
      # snapshot is not lost: download it from the run's Artifacts.
      - name: Keep snapshot if the push failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: line-snapshot-${{ github.run_id }}
          path: |
            data/raw/snapshots/
            data/raw/pull_metadata.json
          retention-days: 30
